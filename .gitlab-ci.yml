---
stages:
  - test
  - build
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CGO_ENABLED: "0"

include:
  - component: $CI_SERVER_FQDN/ci/security/bundle@1
  - component: $CI_SERVER_FQDN/ci/golang/init-vet@2
    inputs:
      working_dirs: [src/tsblock]
      golang_image_suffix: ""
      pre_script: [&apply-patches 'git -C src/tsblock apply -v "$CI_PROJECT_DIR"/src/patches/*.patch']
  - component: $CI_SERVER_FQDN/ci/golang/lint@2
    inputs:
      working_dirs: [src/tsblock]
      pre_script: [*apply-patches]
  - component: $CI_SERVER_FQDN/ci/golang/build-binaries@2
    inputs:
      job_name: compile tsblock
      binary_name: tsblock
      working_dir: src/tsblock
      pre_build_script: *apply-patches
  - component: $CI_SERVER_FQDN/ci/golang/build-binaries@2
    inputs:
      job_name: compile tsblock-btf
      binary_name: tsblock-btf
      working_dir: src/tsblock/cmd/tsblock-btf
      pre_build_script: *apply-patches
  - component: $CI_SERVER_FQDN/ci/release/package-registry@2
    inputs:
      job_name: publish binaries
      package_name: tsblock
      package_tag: latest
      local_files: >-
        binaries/tsblock-${CI_COMMIT_REF_NAME}-linux-amd64:tsblock-linux-amd64,
        binaries/tsblock-${CI_COMMIT_REF_NAME}-linux-arm64:tsblock-linux-arm64,
        binaries/tsblock-btf-${CI_COMMIT_REF_NAME}-linux-amd64:tsblock-btf-linux-amd64,
        binaries/tsblock-btf-${CI_COMMIT_REF_NAME}-linux-arm64:tsblock-btf-linux-arm64

publish binaries:
  needs: [compile tsblock, compile tsblock-btf]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
