---
stages:
  - test
  - build
  - publish

include:
  - component: $CI_SERVER_FQDN/ci/sast/sast@1
  - component: $CI_SERVER_FQDN/ci/sast/iac@1
  - component: $CI_SERVER_FQDN/ci/sast/bearer@1
  - component: $CI_SERVER_FQDN/ci/sast/datadog@1
  - component: $CI_SERVER_FQDN/ci/secret-detection/sd@1
  - component: $CI_SERVER_FQDN/ci/dependency-scanning/ds@1
  - component: $CI_SERVER_FQDN/ci/golang/init-vet@1
    inputs:
      working_dir: src/tsblock
  - component: $CI_SERVER_FQDN/ci/golang/lint@1
    inputs:
      working_dir: src/tsblock
  - component: $CI_SERVER_FQDN/ci/golang/test@1
    inputs:
      working_dir: src/tsblock
  - component: $CI_SERVER_FQDN/ci/golang/build-binaries@1
    inputs:
      job_name: compile binary
      binary_name: tsblock
      working_dir: src/tsblock
      build_architectures: linux/amd64,linux/arm64
  - component: $CI_SERVER_FQDN/ci/release/package-registry@1
    inputs:
      job_name: publish binaries
      package_name: tsblock
      package_tag: latest
      dependant_job: compile binary
      local_files: >-
        binaries/tsblock-${CI_COMMIT_REF_NAME}-linux-amd64:tsblock-linux-amd64,
        binaries/tsblock-${CI_COMMIT_REF_NAME}-linux-arm64:tsblock-linux-arm64

.build rules: &build-rules
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/tsblock/**/*
        - src/patches/**/*
        - .gitlab-ci.yml

.apply patches: &apply-patches
  before_script:
    - |
      if [ -d "src/patches" ] && [ -n "$(ls -A src/patches/*.patch 2>/dev/null)" ]; then
        cd "./src/tsblock/" || exit
        git apply --stat ../patches/*.patch && git apply --binary ../patches/*.patch
        cd "../../" || exit
      fi

.apply patches and prepare binary compilation base:
  &apply-patches-prepare-binary-compile-base
  - set -e
  - |
    if [ -d "src/patches" ] && [ -n "$(ls -A src/patches/*.patch 2>/dev/null)" ]; then
      cd "./src/tsblock/" || exit
      git apply --stat ../patches/*.patch && git apply --binary ../patches/*.patch
      cd "../../" || exit
    fi
  - mkdir -p "binaries/"
  - FULL_PATH_TO_BINARIES_DIR=$(realpath binaries)
  - |
    VERSION="$CI_COMMIT_REF_NAME"
    if [[ -n "$CI_COMMIT_TAG" && ! "$VERSION" =~ ^v ]]; then
      VERSION="v$VERSION"
    fi
  - |
    build_binary() {
      local name="$1" os="$2" arch="$3"
      echo "Building $name for $os/$arch..."
      CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags="-s -w" -trimpath -a -o "$FULL_PATH_TO_BINARIES_DIR/$name-$os-$arch" || return 1
    }

.apply patches and prepare binary compilation (tsblock):
  &apply-patches-prepare-binary-compile-tsblock
  before_script:
    - *apply-patches-prepare-binary-compile-base
    - cd "./src/tsblock/" || exit 1

variables:
  GIT_SUBMODULE_STRATEGY: recursive

go test:
  <<:
    - *apply-patches

golangci-lint:
  <<:
    - *apply-patches

init + vet:
  <<:
    - *apply-patches

compile binary:
  <<:
    - *build-rules
    - *apply-patches-prepare-binary-compile-tsblock

publish binaries:
  <<: *build-rules
